<!DOCTYPE html>
<html lang="en">

<head>

    <title>Table form</title>
</head>

<body>
    <table border="10">
        <tr>
            <!-- headings -->
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <!-- 1st data -->
            <td>Navin</td>

            <td>22</td>
        </tr>
        <tr>

            <td>Ravi</td>
            <td>Kumar</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Ramesh</td>
            <td>Reddy</td>
            <td>24</td>
        </tr>
</body>

</html>
