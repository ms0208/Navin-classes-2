<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type CSS</title>
    <style>
        *{
            color:rgb(150, 18, 18);
        }
        p{
            background-color: blue;
            height:50px;
            width: 1000px;
            border:10px solid black
        }
        h1{
            font-size: 30px;
        }
        .nav{
            list-style: none;
        }
        .ul{
            list-style: none;
        }
        #nv{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <h1>Inline css</h1>
    <h1>CSS CASCADING STYLE SHEET</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. At, totam.</p>
    <div class="nav">
        <ul class="ul"> 
            <li id="nv">Naveen</li>
            <li>Manav</li>
            <li>Pranav</li>
        </ul>
    </div>
</body>
</html>
